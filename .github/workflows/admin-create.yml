name: Admin Create

# =============================================================================
# 管理画面にサインインできる admin を登録する (admins に email を足す)
# =============================================================================
# 最後に deploy した migration イメージで、packages/db の admin:create を流す
# (.github/actions/run-deployed-migration の command で起動コマンドを差し替える)。
# 登録済みの email なら何もしない (何度流してもよい)。
#
# 手順は docs/deploy/prd.md の「admin を登録する」。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - min
          - prd
      email:
        description: "admin にする Google アカウントの email"
        required: true
        type: string

# 同じ環境の deploy と同時に走らないよう、deploy workflow と同じ group にする
concurrency:
  group: deploy-aws-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  create:
    name: Create admin (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4 # composite action を使うため

      # 入力は env で渡し、run の中に ${{ }} で展開しない (コマンドの注入を防ぐ)。JSON は jq で組み立てる
      - name: Build command
        id: command
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          # email に使える文字だけを許す ($ や ' やバッククォート、空白を通さない)
          if ! [[ "${EMAIL}" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::Invalid email"
            exit 1
          fi
          # pnpm が出す起動行 (> tsx drizzle/create-admin.ts "--email" "...") は CloudWatch Logs に入り、この workflow のログにも写る。
          # --silent で消えるのは --filter を使わないときだけ (pnpm 9 は --filter だと --silent でも起動行を出す) なので、
          # --dir (migration イメージの WORKDIR の /app からの相対) で動かす
          echo "command=$(jq -cn --arg email "${EMAIL}" '["pnpm","--silent","--dir","packages/db","admin:create","--email",$email]')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run admin:create
        uses: ./.github/actions/run-deployed-migration
        with:
          environment: ${{ inputs.environment }}
          task-definition: tech-english-${{ inputs.environment }}-migration
          command: ${{ steps.command.outputs.command }}
