name: Postgres Migrate

# =============================================================================
# Postgres (Drizzle) の migration だけを流す (deploy をやり直さずに)
# =============================================================================
# 使いどころ:
# - deploy の migrate が一時的なエラーで失敗したとき、イメージを作り直さずに流し直す
#
# 最後に deploy した migration イメージで起動する (.github/actions/run-deployed-migration)。
# 新しい migration を適用するときは、今までどおり deploy で流す (migration イメージに入るため)。
# ClickHouse の migration は clickhouse-migrate.yml。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - min
          - prd

# 同じ環境の deploy と同時に走らないよう、deploy workflow と同じ group にする
concurrency:
  group: deploy-aws-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  migrate:
    name: Run DB Migration (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4 # composite action を使うため

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DB migration
        uses: ./.github/actions/run-deployed-migration
        with:
          environment: ${{ inputs.environment }}
          task-definition: tech-english-${{ inputs.environment }}-migration
