name: Deploy to AWS dev

# =============================================================================
# Job 構成
# =============================================================================
# detect (ClickHouse の有無)
# build → migrate → ┬→ migrate-dwh   (ClickHouse の migration。enable_data_warehouse の環境だけ)
#                   ├→ deploy-api    (rolling 完走)
#                   ├→ deploy-worker (rolling 完走。migrate-dwh の成功 / skip を待つ)
#                   └→ deploy-cron   (task definition revision を register するのみ)
#
# dev は rolling deploy (env/dev/main.tf の ecs_api / ecs_worker で enable_blue_green = false)
# のため承認ゲートを持たず、deploy-* は wait-for-service-stability=true で完走を待つ。
# Blue/Green + GitHub UI 承認が必要な本番デプロイは deploy-aws-prd.yml を参照。
# =============================================================================

on:
  workflow_dispatch:

# 並列 deploy を禁止する。先発 run を完走させてから後発 run をキューから流す
# (cancel-in-progress: false)。同一サービスに対する update-service が重なって
# task definition の revision が前後するのを防ぐ目的。
concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

  # =============================================================================
  # 環境ごとに変える値 — prd 作成時は deploy-aws-prd.yml を新設して下記を書き換える
  # =============================================================================
  # AWS リソースタグ (Terraform default_tags の Project / Environment と一致させる)
  PROJECT_NAME: tech-english
  ENVIRONMENT: dev

  # ECR (environment 非依存だが project_name は含む)
  ECR_API_REPO: tech-english-api-server
  ECR_WORKER_REPO: tech-english-worker
  ECR_MIGRATION_REPO: tech-english-migration
  ECR_CRON_REPO: tech-english-cron

  # ECS リソース (project_name-environment- プレフィックスを持つ)
  ECS_CLUSTER: tech-english-dev-cluster
  ECS_API_SERVICE: tech-english-dev-api
  ECS_WORKER_SERVICE: tech-english-dev-worker
  ECS_MIGRATION_TASK_DEF: tech-english-dev-migration
  ECS_CRON_TASK_DEF: tech-english-dev-cron
  ECS_DWH_MIGRATION_TASK_DEF: tech-english-dev-dwh-migration

  # ClickHouse の接続情報の secret。Terraform の enable_data_warehouse = true の環境にだけある
  DATA_WAREHOUSE_SECRET_ID: /tech-english-dev/data-warehouse

  # VPC リソース解決用 (Terraform 側 modules/vpc の Name タグと一致)
  ECS_SECURITY_GROUP_NAME: tech-english-dev-ecs
  PRIVATE_SUBNET_NAME_PREFIX: tech-english-dev-private # `${prefix}*` で wildcard 検索する

jobs:
  # =========================================================================
  # ClickHouse の有無 (= Terraform の enable_data_warehouse) を調べる
  # =========================================================================
  # 判定の正本は Terraform のフラグだけ。
  # dwh-migration のタスク定義では判定しない (deploy が register した revision が、フラグを
  # false にしても ACTIVE のまま残るため)。設計: docs/spec/clickhouse-migration/README.md
  detect:
    name: Detect data warehouse
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      dwh_enabled: ${{ steps.dwh.outputs.dwh_enabled }}
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # secret が無い以外のエラー (権限不足など) で false にすると migration が黙って飛ばされるので、失敗させる
      - name: Check data warehouse secret
        id: dwh
        run: |
          if OUTPUT=$(aws secretsmanager describe-secret --secret-id "${DATA_WAREHOUSE_SECRET_ID}" --query Name --output text 2>&1); then
            echo "dwh_enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q ResourceNotFoundException <<< "${OUTPUT}"; then
            echo "dwh_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "${OUTPUT}" >&2
            exit 1
          fi

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # GitHub Environments の env-scope から AWS_ROLE_ARN を取得
    # prd は別ファイル deploy-aws-prd.yml（承認ゲートやトリガーが本質的に違うため matrix にしない）
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # mutable な :latest を避け、コミット SHA タグ (例: :abc123def456) のみを push する
      - name: Build & push API image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPO }}"
          docker buildx build \
            --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "${IMAGE}:${{ steps.meta.outputs.image_tag }}" \
            --push \
            .

      - name: Build & push worker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_WORKER_REPO }}"
          docker buildx build \
            --platform linux/amd64 \
            -f apps/worker/Dockerfile \
            -t "${IMAGE}:${{ steps.meta.outputs.image_tag }}" \
            --push \
            .

      - name: Build & push migration image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_MIGRATION_REPO }}"
          docker buildx build \
            --platform linux/amd64 \
            -f packages/db/Dockerfile.migration \
            -t "${IMAGE}:${{ steps.meta.outputs.image_tag }}" \
            --push \
            .

      - name: Build & push cron image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_CRON_REPO }}"
          docker buildx build \
            --platform linux/amd64 \
            -f apps/cron/Dockerfile \
            -t "${IMAGE}:${{ steps.meta.outputs.image_tag }}" \
            --push \
            .

  migrate:
    name: Run DB Migration
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4 # composite action を使うため

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform output や GitHub Secrets で固定化せず、AWS リソースのタグから動的に解決する。
      # 環境を destroy / apply し直しても (subnet ID / SG ID が変わっても) 自動で追従する。
      - name: Resolve network configuration from tags
        id: network
        run: |
          set -euo pipefail

          # default_tags (Project / Environment) で VPC を特定
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=${PROJECT_NAME}" "Name=tag:Environment,Values=${ENVIRONMENT}" \
            --query 'Vpcs[0].VpcId' --output text)

          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            echo "::error::VPC not found (tag:Project=${PROJECT_NAME} tag:Environment=${ENVIRONMENT})"
            exit 1
          fi

          # isolatedのsubnetが含まれないようにnameでフィルタリング (prefix は workflow env で定義)
          PRIVATE_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${PRIVATE_SUBNET_NAME_PREFIX}*" \
            --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')

          # ECS task 用 SG (Terraform 側 Name = "${var.name}-ecs")
          ECS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${ECS_SECURITY_GROUP_NAME}" \
            --query 'SecurityGroups[0].GroupId' --output text)

          if [ -z "${PRIVATE_SUBNETS}" ] || [ -z "${ECS_SG}" ] || [ "${ECS_SG}" = "None" ]; then
            echo "::error::Failed to resolve subnets or security group (VPC=${VPC_ID} subnets='${PRIVATE_SUBNETS}' sg='${ECS_SG}')"
            exit 1
          fi

          echo "Resolved: VPC=${VPC_ID} subnets=${PRIVATE_SUBNETS} ecs_sg=${ECS_SG}"
          echo "private_subnets=${PRIVATE_SUBNETS}" >> "$GITHUB_OUTPUT"
          echo "ecs_security_group=${ECS_SG}" >> "$GITHUB_OUTPUT"

      # migration task definition の image を build job の SHA タグに書き換えた revision で起動する。
      # migration は専用イメージ (tech-english-migration) を参照 — drizzle-kit を本番 API に混入させないため。
      - name: Run DB migration
        uses: ./.github/actions/run-one-shot-task
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          task-definition: ${{ env.ECS_MIGRATION_TASK_DEF }}
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_MIGRATION_REPO }}:${{ needs.build.outputs.image_tag }}
          subnets: ${{ steps.network.outputs.private_subnets }}
          security-group: ${{ steps.network.outputs.ecs_security_group }}

  # =========================================================================
  # ClickHouse migration (enable_data_warehouse の環境だけ)
  # =========================================================================
  # Drizzle の migrate の後に流す (CDC の view の元テーブルが Postgres に先にできている必要があるため)。
  # 失敗しても api / cron の deploy は止めない (分析用のため)。worker は ClickHouse に書くので待たせる。
  migrate-dwh:
    name: Run ClickHouse Migration
    needs: [detect, build, migrate]
    if: ${{ needs.detect.outputs.dwh_enabled == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4 # composite action を使うため

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform output や GitHub Secrets で固定化せず、AWS リソースのタグから動的に解決する。
      # 環境を destroy / apply し直しても (subnet ID / SG ID が変わっても) 自動で追従する。
      - name: Resolve network configuration from tags
        id: network
        run: |
          set -euo pipefail

          # default_tags (Project / Environment) で VPC を特定
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=${PROJECT_NAME}" "Name=tag:Environment,Values=${ENVIRONMENT}" \
            --query 'Vpcs[0].VpcId' --output text)

          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            echo "::error::VPC not found (tag:Project=${PROJECT_NAME} tag:Environment=${ENVIRONMENT})"
            exit 1
          fi

          # isolatedのsubnetが含まれないようにnameでフィルタリング (prefix は workflow env で定義)
          PRIVATE_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${PRIVATE_SUBNET_NAME_PREFIX}*" \
            --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')

          # ECS task 用 SG (Terraform 側 Name = "${var.name}-ecs")
          ECS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${ECS_SECURITY_GROUP_NAME}" \
            --query 'SecurityGroups[0].GroupId' --output text)

          if [ -z "${PRIVATE_SUBNETS}" ] || [ -z "${ECS_SG}" ] || [ "${ECS_SG}" = "None" ]; then
            echo "::error::Failed to resolve subnets or security group (VPC=${VPC_ID} subnets='${PRIVATE_SUBNETS}' sg='${ECS_SG}')"
            exit 1
          fi

          echo "Resolved: VPC=${VPC_ID} subnets=${PRIVATE_SUBNETS} ecs_sg=${ECS_SG}"
          echo "private_subnets=${PRIVATE_SUBNETS}" >> "$GITHUB_OUTPUT"
          echo "ecs_security_group=${ECS_SG}" >> "$GITHUB_OUTPUT"

      - name: Run ClickHouse migration
        uses: ./.github/actions/run-one-shot-task
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          task-definition: ${{ env.ECS_DWH_MIGRATION_TASK_DEF }}
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_MIGRATION_REPO }}:${{ needs.build.outputs.image_tag }}
          subnets: ${{ steps.network.outputs.private_subnets }}
          security-group: ${{ steps.network.outputs.ecs_security_group }}

  # =========================================================================
  # API service (rolling)
  # =========================================================================
  # API は rolling deploy なので wait-for-service-stability=true で完走を待つ。

  deploy-api:
    name: Deploy API service
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_API_SERVICE}" \
            --query taskDefinition \
            > task-def-api.json

      - name: Render API task definition with new image
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-api.json
          container-name: ${{ env.ECS_API_SERVICE }}
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_API_REPO }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # =========================================================================
  # worker service (rolling)
  # =========================================================================
  # worker は rolling deploy なので wait-for-service-stability=true で完走を待つ。
  # migrate-dwh が skip (ClickHouse の無い環境) でも進めるため、needs の結果で条件を書く。
  # detect の失敗で migrate-dwh が skip になったときは進めない
  deploy-worker:
    name: Deploy worker service
    needs: [detect, build, migrate, migrate-dwh]
    if: >-
      ${{ !cancelled()
        && needs.detect.result == 'success'
        && needs.migrate.result == 'success'
        && (needs.migrate-dwh.result == 'success' || needs.migrate-dwh.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_WORKER_SERVICE}" \
            --query taskDefinition \
            > task-def-worker.json

      - name: Render worker task definition with new image
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-worker.json
          container-name: ${{ env.ECS_WORKER_SERVICE }}
          image: ${{ needs.build.outputs.registry }}/${{ env.ECR_WORKER_REPO }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # =========================================================================
  # cron task definition (EventBridge Scheduler が最新 revision を起動)
  # =========================================================================
  # cron は Service を持たず EventBridge Scheduler から RunTask される one-shot task。
  # ここでは新 image の task definition revision を register するだけでよい。
  deploy-cron:
    name: Register cron task definition
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register cron task definition with new image
        env:
          IMAGE: ${{ needs.build.outputs.registry }}/${{ env.ECR_CRON_REPO }}:${{ needs.build.outputs.image_tag }}
        run: |
          TASK_DEF_FILE=$(mktemp)
          aws ecs describe-task-definition \
            --task-definition "${ECS_CRON_TASK_DEF}" \
            --query taskDefinition \
            | jq --arg IMAGE "${IMAGE}" '
                .containerDefinitions[0].image = $IMAGE
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
              ' > "${TASK_DEF_FILE}"

          REVISION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${TASK_DEF_FILE}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Registered cron task definition: ${REVISION_ARN}"
